name: build

# Rebuilds dist/ from families/ twice and checks that the two builds and the
# committed dist/ are byte for byte the same, so what Dropdf downloads is
# exactly what build.py makes from the pinned upstream files.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pinned, not ubuntu-latest: a new image is a change made on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - name: Install fontTools (hash-checked)
        run: |
          python -m pip install --require-hashes --no-deps --only-binary ':all:' -r requirements.txt

      - name: Read the committed manifest's tag and commit
        id: source
        run: |
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          source = json.load(open("dist/manifest.json", encoding="utf-8"))["source"]
          print(f"tag={source['tag']}")
          print(f"commit={source['commit']}")
          EOF

      - name: A tag names the manifest's own tag
        if: github.ref_type == 'tag'
        env:
          MANIFEST_TAG: ${{ steps.source.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$MANIFEST_TAG" ]; then
            echo "tag $GITHUB_REF_NAME, but dist/manifest.json says $MANIFEST_TAG" >&2
            exit 1
          fi

      - name: Build twice
        env:
          TAG: ${{ steps.source.outputs.tag }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python build.py --out "$RUNNER_TEMP/one" --tag "$TAG" --commit "$COMMIT"
          python build.py --out "$RUNNER_TEMP/two" --tag "$TAG" --commit "$COMMIT"
          diff -r "$RUNNER_TEMP/one" "$RUNNER_TEMP/two"

      - name: Same as the committed dist/
        run: diff -r "$RUNNER_TEMP/one" dist

      - name: Every licence file is present
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          dist = pathlib.Path("dist")
          manifest = json.load(open(dist / "manifest.json", encoding="utf-8"))
          bad = []
          ids = {f["id"] for f in manifest["files"]}
          for d in sorted(pathlib.Path("families").iterdir()):
              lic = [p for p in (d / "OFL.txt", d / "LICENSE") if p.is_file()]
              if len(lic) != 1:
                  bad.append(f"{d}: expected one OFL.txt or LICENSE, found {len(lic)}")
              if d.name not in ids:
                  bad.append(f"{d}: no fonts in the manifest")
          for f in manifest["files"]:
              lic = dist / f["licenceFile"]
              src = [p for p in (pathlib.Path("families", f["id"], n) for n in ("OFL.txt", "LICENSE")) if p.is_file()]
              if not (dist / f["path"]).is_file():
                  bad.append(f"{f['path']}: missing from dist/")
              if not lic.is_file():
                  bad.append(f"{f['path']}: licence {f['licenceFile']} missing from dist/")
              elif not src or lic.read_bytes() != src[0].read_bytes():
                  bad.append(f"{f['licenceFile']}: not the licence in families/{f['id']}/")
          if bad:
              sys.exit("\n".join(bad))
          print(f"{len(manifest['files'])} fonts, each with its licence")
          EOF
